<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="2; url=/index.html">
    <title>Page Not Found — Thikana Dhabla Ghosi</title>
    <style>
        body {
            font-family: 'Lora', serif;
            background: #F2E8D5;
            color: #2B1810;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: #F7F1E4;
            border: 2px solid #C99A3A;
            border-radius: 12px;
            padding: 40px 32px;
            max-width: 520px;
            box-shadow: 0 8px 22px rgba(43,24,16,0.1);
        }
        h1 {
            font-family: 'Cinzel', serif;
            color: #7A1F1F;
            font-size: 1.8rem;
            margin-bottom: 12px;
        }
        p { color: #4A3C2C; line-height: 1.8; }
        a { color: #7A1F1F; font-weight: 600; text-decoration: underline; }
        .devnag { font-family: 'Tiro Devanagari Hindi', serif; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🙏 Page Not Found</h1>
        <p>This page does not exist. Redirecting you to the <a href="/index.html">home page</a>…</p>
        <p class="devnag">यह पृष्ठ मौजूद नहीं है। आपको मुख्य पृष्ठ पर भेजा जा रहा है…</p>
    </div>
    <script>
        setTimeout(() => { window.location.href = '/index.html'; }, 2000);
    </script>
</body>
</html>
